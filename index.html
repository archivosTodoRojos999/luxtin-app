<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<title>LUXTIN</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== SPLASH ANIMATION ===================== -->
<div id="splash" class="splash-screen">
  <div class="splash-bg"></div>
  <div class="splash-content">
    <div class="luxtin-logo">
      <div class="luxtin-letters">
        <span class="letter" style="--delay:0s">L</span>
        <span class="letter" style="--delay:0.1s">U</span>
        <span class="letter" style="--delay:0.2s">X</span>
        <span class="letter" style="--delay:0.3s">T</span>
        <span class="letter" style="--delay:0.4s">I</span>
        <span class="letter" style="--delay:0.5s">N</span>
      </div>
      <div class="luxtin-shine"></div>
    </div>
    <div class="luxtin-subtitle">FÚTBOL · MÚSICA · PELÍCULAS</div>
  </div>
</div>

<!-- ===================== MAIN APP ===================== -->
<div id="app" class="app hidden">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar-logo">LUXTIN</div>
    <nav class="nav-tabs">
      <button class="nav-btn active" data-section="deportes">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2v20M2 12h20"/></svg>
        <span>Deportes</span>
      </button>
      <button class="nav-btn" data-section="musica">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span>Música</span>
      </button>
      <button class="nav-btn" data-section="peliculas">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18"/><path d="M10 15V9l5 3-5 3z" fill="currentColor"/></svg>
        <span>Películas</span>
      </button>
    </nav>
  </header>

  <!-- ===================== SECCIÓN DEPORTES ===================== -->
  <section id="deportes" class="section active">
    <div class="section-header">
      <h1>Partidos en Vivo</h1>
      <p class="section-sub">Fútbol mundial en tiempo real — ESPN</p>
    </div>

    <div class="filter-chips" id="league-filters">
      <button class="chip active" data-league="all">Todas</button>
      <button class="chip" data-league="eng.1">Inglaterra</button>
      <button class="chip" data-league="esp.1">España</button>
      <button class="chip" data-league="ita.1">Italia</button>
      <button class="chip" data-league="ger.1">Alemania</button>
      <button class="chip" data-league="arg.1">Argentina</button>
      <button class="chip" data-league="ned.1">Holanda</button>
      <button class="chip" data-league="por.1">Portugal</button>
    </div>

    <div id="matches-list" class="matches-list">
      <div class="loading">Cargando partidos en vivo...</div>
    </div>

    <button id="refresh-matches" class="btn-primary">🔄 Actualizar partidos</button>
  </section>

  <!-- ===================== SECCIÓN MÚSICA ===================== -->
  <section id="musica" class="section">
    <div class="section-header">
      <h1>Música</h1>
      <p class="section-sub">Canciones reales — busca y escucha</p>
    </div>

    <!-- BUSCADOR -->
    <div class="search-bar">
      <input type="text" id="music-search" placeholder="Buscar canción o artista...">
      <button id="music-search-btn" class="btn-primary">Buscar</button>
    </div>

    <!-- TRENDING / RESULTADOS TAB -->
    <div class="filter-chips" id="music-tabs">
      <button class="chip active" data-tab="trending">🔥 Tendencias</button>
      <button class="chip" data-tab="results">Resultados</button>
    </div>

    <!-- REPRODUCTOR DE AUDIO (preview + link YouTube) -->
    <div id="music-player" class="music-player hidden">
      <div class="player-info">
        <div class="player-main-row">
          <img id="player-artwork" class="player-artwork" src="" alt="">
          <div class="player-text">
            <div id="now-playing-title" class="now-playing-title"></div>
            <div id="now-playing-channel" class="now-playing-channel"></div>
          </div>
        </div>
        <audio id="audio-preview" controls style="width:100%;margin-top:0.6rem;"></audio>
        <div class="player-controls">
          <button id="prev-track" class="ctrl-btn">⏮</button>
          <button id="next-track" class="ctrl-btn">⏭</button>
          <a id="youtube-full-link" href="#" target="_blank" class="btn-primary" style="text-decoration:none;display:inline-flex;align-items:center;gap:0.3rem;">
            ▶ Escuchar completa en YouTube
          </a>
          <button id="minimize-player" class="ctrl-btn mini-btn">▾ Minimizar</button>
        </div>
      </div>
    </div>

    <!-- RESULTADOS / TRENDING -->
    <div id="music-trending" class="music-grid"></div>
    <div id="music-results" class="music-grid hidden"></div>
  </section>

  <!-- ===================== SECCIÓN PELÍCULAS ===================== -->
  <section id="peliculas" class="section">
    <div class="section-header">
      <h1>Películas</h1>
      <p class="section-sub">Catálogo real con trailers — Apple Movies</p>
    </div>

    <div class="search-bar">
      <input type="text" id="movie-search" placeholder="Buscar película...">
      <button id="movie-search-btn" class="btn-primary">Buscar</button>
    </div>

    <div class="filter-chips" id="movie-tabs">
      <button class="chip active" data-tab="trending">🔥 Tendencias</button>
      <button class="chip" data-tab="results">Resultados</button>
    </div>

    <div id="movies-trending" class="movies-grid"></div>
    <div id="movies-grid" class="movies-grid hidden"></div>

    <!-- MODAL PELÍCULA -->
    <div id="movie-modal" class="movie-modal hidden">
      <div class="modal-content">
        <button id="close-modal" class="modal-close">✕</button>
        <div id="modal-body"></div>
      </div>
    </div>
  </section>

  <!-- MINI PLAYER FLOTANTE -->
  <div id="mini-player" class="mini-player hidden">
    <div class="mini-player-info">
      <div id="mini-title"></div>
    </div>
    <button id="expand-player" class="ctrl-btn">▴ Expandir</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
