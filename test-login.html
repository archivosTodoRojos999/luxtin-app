<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Test Login</title></head>
<body>

<script>

  try {
    const res = await fetch('https://base44.app/api/apps/6a7d58526b15a2d266e69ab4/functions/luxtinAuth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'login', email: 'lucianosala269@gmail.com', password: '50173533' })
    });
    const data = await res.json();
    document.getElementById('result').textContent = JSON.stringify(data, null, 2);
  } catch(e) {
    document.getElementById('result').textContent = 'ERROR: ' + e.message + '\n' + e.stack;
  }
}
</script>
